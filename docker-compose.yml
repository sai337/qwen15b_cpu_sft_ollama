services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    # Bound to localhost: Ollama has no auth. Put a gateway/reverse proxy in front before exposing it.
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama:/root/.ollama
      - ./ollama:/models
    command: ["serve"]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12

  ui:
    build:
      context: .
      dockerfile: docker/Dockerfile.ui
    container_name: ollama-ui
    restart: unless-stopped
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen15b-cloudqa}
    ports:
      - "${UI_BIND:-127.0.0.1}:8501:8501"
    depends_on:
      ollama:
        condition: service_healthy

volumes:
  ollama:
